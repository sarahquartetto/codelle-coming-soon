<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="codelle — site web en construction" />
    <link rel="icon" type="image/png" href="./codelle-logo-cafe.png?v=4" />

    <title>codelle</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      @property --frame-angle {
        syntax: "<angle>";
        inherits: false;
        initial-value: 0deg;
      }

      html,
      body {
        height: 100%;
        min-height: 100dvh;
        background-color: #f58c76;
        background-image:
          radial-gradient(
            ellipse 70% 62% at 50% 50%,
            transparent 0%,
            transparent 28%,
            rgba(250, 248, 243, 0.45) 55%,
            rgba(250, 248, 243, 0.78) 78%,
            #faf8f3 100%
          ),
          linear-gradient(
            90deg,
            #f9d94a 0%,
            #f7c462 22%,
            #f58c76 50%,
            #b89648 78%,
            #657620 100%
          );
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-attachment: fixed;
      }

      body {
        font-family: Outfit, system-ui, sans-serif;
        color: #fff;
      }

          var(--pixel) calc(var(--pixel) * 3) 0 0 #fde68a,
          calc(var(--pixel) * 2) calc(var(--pixel) * 3) 0 0 #fde68a,
          calc(var(--pixel) * 3) calc(var(--pixel) * 3) 0 0 #fbbf24,
          calc(var(--pixel) * 4) calc(var(--pixel) * 3) 0 0 #f59e0b,

      .shooting-star {
        top: 0;
        left: 0;
        width: var(--pixel);
        height: var(--pixel);
        background: #fff;
        box-shadow:
          calc(var(--pixel) * -1) var(--pixel) 0 0 #ede9fe,
          calc(var(--pixel) * -2) calc(var(--pixel) * 2) 0 0 rgba(221, 214, 254, 0.7),
          calc(var(--pixel) * -3) calc(var(--pixel) * 3) 0 0 rgba(221, 214, 254, 0.35);
        animation: shoot 7s steps(14, end) infinite;
      }

      @keyframes shoot {
        0%,
        12% {
          transform: translate(8vw, 6px);
          opacity: 0;
        }
        16% {
          opacity: 1;
        }
        38% {
          transform: translate(42vw, calc(var(--sky-pad) * 0.55));
          opacity: 0;
        }
        100% {
          opacity: 0;
        }
      }

      @media (min-width: 640px) {
        :root {
          --sky-pad: 80px;
          --pixel: 4px;
        }
      }

        position: relative;
        z-index: 1;
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 5rem 1rem;
      }

      .stack {
        width: 100%;
        max-width: 48rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 0.75rem;
      }

      h1 {
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .logo-wrap {
        display: block;
        width: 100%;
        max-width: 24rem;
        background-color: #fff;
        -webkit-mask-image: url("./codelle-logo-degrade-corail.png");
        mask-image: url("./codelle-logo-degrade-corail.png");
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
      }

      .logo {
        display: block;
        width: 100%;
        height: auto;
        object-fit: contain;
        image-rendering: auto;
        opacity: 0;
      }

      .copy {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
      }

      .status {
        font-size: 1.125rem;
        font-weight: 500;
        line-height: 1.45;
        letter-spacing: 0.01em;
        color: #fff;
      }

      .status-break {
        display: block;
      }

      .contact {
        font-size: 0.9375rem;
        font-weight: 400;
        line-height: 1.5;
        letter-spacing: 0.01em;
        color: #fff;
        text-wrap: balance;
        max-width: 22rem;
      }

      .contact a {
        color: #fff;
        text-decoration: none;
      }

      .contact a:hover {
        text-decoration: underline;
        text-decoration-color: #fff;
        text-underline-offset: 3px;
      }

      .dots span {
        display: inline-block;
        opacity: 0;
        animation-duration: 1.8s;
        animation-timing-function: steps(1, end);
        animation-iteration-count: infinite;
      }

      .dots span:nth-child(1) {
        animation-name: dot-1;
      }

      .dots span:nth-child(2) {
        animation-name: dot-2;
      }

      .dots span:nth-child(3) {
        animation-name: dot-3;
      }

      @keyframes dot-1 {
        0%,
        12% {
          opacity: 0;
        }
        13%,
        80% {
          opacity: 1;
        }
        81%,
        100% {
          opacity: 0;
        }
      }

      @keyframes dot-2 {
        0%,
        32% {
          opacity: 0;
        }
        33%,
        80% {
          opacity: 1;
        }
        81%,
        100% {
          opacity: 0;
        }
      }

      @keyframes dot-3 {
        0%,
        52% {
          opacity: 0;
        }
        53%,
        80% {
          opacity: 1;
        }
        81%,
        100% {
          opacity: 0;
        }
      }

      @media (min-width: 640px) {
        .sky {
          padding: 2.5rem;
        }

        /* .frame::before {
          padding: 6px;
        } */

        .content {
          padding-left: 1.5rem;
          padding-right: 1.5rem;
        }

        .logo-wrap {
          max-width: 28rem;
        }

        .status {
          font-size: 1.25rem;
        }

        .status-break {
          display: inline;
        }

        .contact {
          font-size: 1rem;
          max-width: none;
        }
      }

      @media (min-width: 1024px) {
        .logo-wrap {
          max-width: 32rem;
        }

        .status {
          font-size: 1.375rem;
        }

        .contact {
          font-size: 1.0625rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .dots span {
          animation: none;
          opacity: 1;
        }

        /* .frame::before {
          animation: none;
          background: #657620;
        } */
      }
    </style>
  </head>
